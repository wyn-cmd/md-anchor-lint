[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "md-anchor-lint"
version = "0.1.0"
description = "Check Markdown files for broken relative links and broken heading anchors"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Wynston Wong" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Documentation",
]

[project.scripts]
md-anchor-lint = "md_anchor_lint.cli:main"

[tool.setuptools]
packages = ["md_anchor_lint"]
